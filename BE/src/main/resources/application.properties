spring.application.name=itjob

# DATABASE CONFIGURATION
spring.datasource.url=jdbc:postgresql://localhost:5432/itjob
spring.datasource.username=admin
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# LOGGING CONFIGURATION - Enable SQL query logging for debugging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.itjob=DEBUG

# SERVER CONFIGURATION
server.port=8081


#REDIS
spring.data.redis.host=localhost
spring.data.redis.port=6379

#LOGGING
logging.level.org.springframework.cache=TRACE

# PAGEABLE CONFIGURATION
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

#secretKey
jwt.signerkey=17df2e17f2944f93cdb5154176ffb55f866eafd86ea6505c0ad3f3d49044e08f6ee689cf1a4a2ad6bc20b27b086fd6fa22e8e1b953643ff565a8ecfe7cc49717
jwt.access-token-duration=900
jwt.refresh-token-duration=604800

# Cookie security (set true in production / when served over HTTPS)
app.cookie.secure=false

# Default admin credentials (override via env vars in production)
app.admin.username=admin123
app.admin.password=admin123

# CORS allowed origins (comma-separated, no wildcard when credentials=true)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# View counter sync interval in milliseconds (default 5 minutes)
view.sync.interval=300000